<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Let's Sing</title>
    <meta name="description" content="Learn your part: hymns and psalms in four-part harmony with a volume control for each voice.">
    <meta name="theme-color" content="#B71C1C">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <header class="topbar">

        <h1 id="page-title">Let's Sing</h1>
        <button class="icon-btn" id="download" aria-label="Download all hymns for offline use" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
        </button>
        <button class="icon-btn" id="theme-toggle" aria-label="Change theme">

        </button>
        <div class="support-wrap">
            <a class="icon-btn" id="support" href="https://buymeacoffee.com/reformedretrieval"
               target="_blank" rel="noopener" aria-label="Support" title="Support">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </a>
            <div id="support-callout" role="dialog" aria-label="Support this project">
                <div class="support-callout-arrow"></div>
                <p class="support-callout-title">A quick note &mdash;</p>
                <p class="support-callout-body">This project is built and maintained in spare time so that anyone can use it for free. If it's been a help to you, would you consider supporting it? Every bit keeps it running for the next person too.</p>
                <div class="support-callout-actions">
                    <a href="https://buymeacoffee.com/reformedretrieval" target="_blank" rel="noopener"
                       class="support-callout-btn support-callout-btn-primary" data-support="acted">Yes</a>
                    <button type="button" class="support-callout-btn support-callout-btn-secondary" data-support="later">Maybe later</button>
                    <button type="button" class="support-callout-btn support-callout-btn-text" data-support="forever">Don't ask again</button>
                </div>
            </div>
        </div>
    </header>
    <main id="app"></main>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
